# Pubblica su Sanity (CMS del nuovo sito) gli articoli Layerloop approvati.
# L'approvazione è il merge della PR aperta dall'agente: solo allora parte la pubblicazione.
name: Pubblica blog Layerloop

on:
  push:
    paths:
      - "layerloop-blog/articoli/*.md"
  workflow_dispatch:
    inputs:
      file:
        description: "Articolo da (ri)pubblicare, es. layerloop-blog/articoli/2026-10-06-....md"
        required: true
      newsletter:
        description: "Crea/aggiorna anche la campagna Mailchimp (si/no)"
        default: "si"
      newsletter_modo:
        description: "bozza | programma | invia (vuoto = variabile MAILCHIMP_MODE)"
        default: ""

jobs:
  pubblica:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml beautifulsoup4
      - name: Articoli modificati
        id: files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=${{ inputs.file }}" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- 'layerloop-blog/articoli/*.md' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: Pubblica
        if: steps.files.outputs.list != ''
        env:
          SANITY_PROJECT: ip459cev
          SANITY_DATASET: layerloop
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          BLOG_CATEGORY: ${{ vars.BLOG_CATEGORY }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY || secrets.MAILCHIMP }}
          MAILCHIMP_LIST_ID: ${{ vars.MAILCHIMP_LIST_ID }}
          MAILCHIMP_AUDIENCE: ${{ vars.MAILCHIMP_AUDIENCE }}
          MAILCHIMP_TAG: ${{ vars.MAILCHIMP_TAG }}
          MAILCHIMP_MODE: ${{ inputs.newsletter_modo || vars.MAILCHIMP_MODE }}
          MAILCHIMP_REPLY_TO: ${{ vars.MAILCHIMP_REPLY_TO }}
          MAILCHIMP_FROM_NAME: ${{ vars.MAILCHIMP_FROM_NAME }}
          NEWSLETTER: ${{ inputs.newsletter || 'si' }}
        run: python layerloop-blog/scripts/publish_sanity.py ${{ steps.files.outputs.list }}
